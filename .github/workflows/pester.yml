name: Pester

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester 4
        shell: ${{ matrix.shell }}
        run: |
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests
        shell: ${{ matrix.shell }}
        run: |
          Import-Module Pester -RequiredVersion 4.10.1
          Invoke-Pester .\Tests
