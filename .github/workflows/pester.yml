name: Pester

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-windows-powershell:
    name: powershell
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester 4
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Repository PSGallery -Force -SkipPublisherCheck

      - name: Run tests
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 4.10.1
          $result = Invoke-Pester .\Tests -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

  test-pwsh:
    name: pwsh
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester 4
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Repository PSGallery -Force -SkipPublisherCheck

      - name: Run tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 4.10.1
          $result = Invoke-Pester .\Tests -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
