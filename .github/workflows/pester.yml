name: Pester

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pwsh
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Pester 4
        id: cache-pester
        uses: actions/cache@v4
        with:
          path: ~/Documents/PowerShell/Modules/Pester
          key: pester-4.10.1-${{ runner.os }}-pwsh

      - name: Install Pester 4
        if: steps.cache-pester.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Repository PSGallery -Force -SkipPublisherCheck

      - name: Run tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 4.10.1
          $result = Invoke-Pester .\Tests -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
